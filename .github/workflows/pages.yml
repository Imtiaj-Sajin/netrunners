# Publishes the story site (site/ + the recorded worlds) to GitHub Pages on every push to main.
name: Publish the story site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "sessions/**"
      - "research/**"
      - "docs/assets/**"
      - "scripts/build-site.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site from the recorded worlds
        run: npx tsx scripts/build-site.ts --out=_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
