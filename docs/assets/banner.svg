<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="NETRUNNERS: autonomous minds, a living world, a buried truth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.6" stop-color="#0b0820"/>
      <stop offset="1" stop-color="#1a0630"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset="0.55" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#111b36" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="node"><stop offset="0" stop-color="#00eaff" stop-opacity=".9"/><stop offset="1" stop-color="#00eaff" stop-opacity="0"/></radialGradient>
    <radialGradient id="node2"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".9"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <!-- the city graph -->
  <g stroke="#1f3164" stroke-width="1.5" fill="none" opacity=".9">
    <path d="M80 300 L190 250 L300 290 L410 230 M190 250 L230 150 L360 120 M820 110 L930 160 L1060 120 L1130 200 M930 160 L960 270 L1090 300 M960 270 L840 310"/>
  </g>
  <g>
    <circle cx="80" cy="300" r="16" fill="url(#node)"/><circle cx="190" cy="250" r="20" fill="url(#node)"/>
    <circle cx="300" cy="290" r="14" fill="url(#node)"/><circle cx="410" cy="230" r="18" fill="url(#node2)"/>
    <circle cx="230" cy="150" r="14" fill="url(#node)"/><circle cx="360" cy="120" r="22" fill="url(#node)"/>
    <circle cx="820" cy="110" r="18" fill="url(#node)"/><circle cx="930" cy="160" r="22" fill="url(#node2)"/>
    <circle cx="1060" cy="120" r="14" fill="url(#node)"/><circle cx="1130" cy="200" r="18" fill="url(#node)"/>
    <circle cx="960" cy="270" r="20" fill="url(#node)"/><circle cx="1090" cy="300" r="14" fill="url(#node2)"/>
    <circle cx="840" cy="310" r="12" fill="url(#node)"/>
  </g>
  <!-- netrunners in motion -->
  <g>
    <circle r="5" fill="#3dffa2"><animateMotion dur="9s" repeatCount="indefinite" path="M80 300 L190 250 L300 290 L410 230"/></circle>
    <circle r="5" fill="#f5e663"><animateMotion dur="7s" repeatCount="indefinite" path="M820 110 L930 160 L1060 120 L1130 200"/></circle>
    <circle r="5" fill="#ff2bd6"><animateMotion dur="11s" repeatCount="indefinite" path="M230 150 L360 120 L230 150 L190 250"/></circle>
    <circle r="5" fill="#00eaff"><animateMotion dur="8s" repeatCount="indefinite" path="M960 270 L1090 300 L960 270 L840 310"/></circle>
  </g>
  <!-- title -->
  <g filter="url(#glow)">
    <text x="600" y="180" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-weight="800" font-size="92" letter-spacing="14" fill="url(#title)">NETRUNNERS</text>
  </g>
  <text x="600" y="180" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-weight="800" font-size="92" letter-spacing="14" fill="none" stroke="#ff2bd6" stroke-width="1" opacity=".35" transform="translate(3 0)">NETRUNNERS
    <animate attributeName="opacity" values=".35;.35;.8;.1;.35" keyTimes="0;.9;.93;.96;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="232" text-anchor="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="19" letter-spacing="5" fill="#9fb0dd">AUTONOMOUS MINDS · A LIVING WORLD · A BURIED TRUTH</text>
  <text x="600" y="266" text-anchor="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="13" letter-spacing="3" fill="#5b6a96">110 TRAITS · 24 EMOTIONS · MEMORY · TRUST · LOVE · BETRAYAL · DEATH · ESCAPE</text>
  <rect x="0" y="0" width="1200" height="360" fill="none" stroke="#00eaff" stroke-opacity=".25"/>
</svg>
